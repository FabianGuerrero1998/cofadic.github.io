<!DOCTYPE html>
<html lang="es">
<head>
    <title>Generador de Módulos para Sheets</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="p-10 bg-slate-900 text-white font-sans">
    <div class="max-w-2xl mx-auto bg-slate-800 p-8 rounded-3xl shadow-2xl">
        <h2 class="text-2xl font-bold mb-6 text-blue-400">Constructor de Módulos JSON</h2>
        
        <p class="text-sm text-slate-400 mb-4">Usa este generador para crear el código que va en la columna <b>"modulos"</b>.</p>

        <textarea id="inputData" class="w-full h-40 p-4 bg-slate-700 rounded-xl mb-4 border border-slate-600 outline-none focus:border-blue-500" placeholder='Pega aquí tu lista de lecciones o escribe el formato...'></textarea>
        
        <button onclick="generar()" class="bg-blue-600 hover:bg-blue-700 px-6 py-3 rounded-xl font-bold transition w-full">
            Generar Código para Excel
        </button>

        <div id="resultadoCont" class="mt-8 hidden">
            <h3 class="text-orange-400 font-bold mb-2">Copia esto y pégalo en la celda:</h3>
            <textarea id="resultado" readonly class="w-full p-4 bg-black text-green-400 text-xs rounded-xl h-32 border border-slate-700"></textarea>
            <p class="text-[10px] mt-2 text-slate-500 italic">* Asegúrate de que no haya saltos de línea al pegar en Sheets.</p>
        </div>
    </div>

    <script>
        function generar() {
            const input = document.getElementById('inputData').value;
            try {
                // Minifica el JSON y escapa caracteres si es necesario
                const obj = JSON.parse(input);
                const minified = JSON.stringify(obj);
                document.getElementById('resultado').value = minified;
                document.getElementById('resultadoCont').classList.remove('hidden');
            } catch (e) {
                alert("Error: El formato del texto no es un JSON válido. Revisa las comas y corchetes.");
            }
        }
    </script>
</body>
</html>
